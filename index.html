<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incubator - Espace Candidat</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSvvlPPi5VEbACwIVzs8uOciTVu9F6H21QElyq_A7x-3ZvWGJU-1qT702c_Ff5As1d/exec";

        const DAYS_OF_WEEK = {
            fr: ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'],
            en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']
        };

        const DAYS_MAP = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

        const MASTERCLASS_SCHEDULE = [
            { id: 1, date: "10 OCT", bg: "bg-indigo-50 border-indigo-200 text-indigo-900", badgeBg: "bg-indigo-600 text-white" },
            { id: 2, date: "24 OCT", bg: "bg-purple-50 border-purple-200 text-purple-900", badgeBg: "bg-purple-600 text-white" },
            { id: 3, date: "07 NOV", bg: "bg-emerald-50 border-emerald-200 text-emerald-900", badgeBg: "bg-emerald-600 text-white" },
            { id: 4, date: "21 NOV", bg: "bg-amber-50 border-amber-200 text-amber-900", badgeBg: "bg-amber-600 text-white" },
            { id: 5, date: "05 DEC", bg: "bg-sky-50 border-sky-200 text-sky-900", badgeBg: "bg-sky-600 text-white" },
            { id: 6, date: "19 DEC", bg: "bg-rose-50 border-rose-200 text-rose-900", badgeBg: "bg-rose-600 text-white" }
        ];

        const MODULES_LIST = [
            { id: 1, month: 1, title: { fr: 'De l’idée à une opportunité validée', en: 'From idea to validated opportunity' } },
            { id: 2, month: 2, title: { fr: 'Construire la venture', en: 'Building the venture' } },
            { id: 3, month: 3, title: { fr: 'Valider le marché', en: 'Validating the market' } },
            { id: 4, month: 4, title: { fr: 'Construire un business durable', en: 'Building a sustainable business' } },
            { id: 5, month: 5, title: { fr: 'Investment & Growth Readiness', en: 'Investment & Growth Readiness' } },
            { id: 6, month: 6, title: { fr: 'Scale & stratégie 2027', en: 'Scale & 2027 strategy' } }
        ];

        const I18N = {
            fr: {
                appTitleCandidate: "Portail Candidat - Planning & Progression",
                appSubtitle: "Programme d'Incubation 2026",
                refreshBtn: "🔄 Actualiser",
                selectedAccount: "Sélectionnez votre compte Startup :",
                availTitle: "1. Vos Disponibilités Hebdomadaires",
                availSubtitle: "Définissez vos jours et créneaux pour participer aux masterclasses.",
                mcScheduleTitle: "Sélectionnez une Masterclass :",
                showAllMc: "Voir toutes les Masterclasses",
                weeklyFreq: "Fréquence souhaitée :",
                timesPerWeek: "fois / semaine",
                presenceDays: "Jours de présence :",
                selectedCount: "sélec.",
                timeSlotLabel: "Créneau horaire :",
                morningSlot: "☀️ Matin (09h00 - 12h00)",
                eveningSlot: "🌙 Soir (17h00 - 20h00)",
                progTitle: "2. Suivi des Modules & Masterclasses",
                progSubtitle: "Cochez les masterclasses suivies ou validées.",
                completedPct: "complété",
                followedMasterclass: "✓ Suivie",
                toFollow: "À suivre",
                notOpened: "🔒 Non ouverte",
                notActiveAlert: "Cette masterclass n'a pas encore été activée par l'équipe de mentorat.",
                maxFreqAlert: "Vous avez choisi une fréquence de {freq} jours max par semaine."
            },
            en: {
                appTitleCandidate: "Candidate Portal - Schedule & Progress",
                appSubtitle: "Incubation Program 2026",
                refreshBtn: "🔄 Refresh",
                selectedAccount: "Select your Startup Account:",
                availTitle: "1. Weekly Availability",
                availSubtitle: "Set your preferred days and time slots for masterclasses.",
                mcScheduleTitle: "Select a Masterclass:",
                showAllMc: "Show all Masterclasses",
                weeklyFreq: "Target Frequency:",
                timesPerWeek: "times / week",
                presenceDays: "Attendance Days:",
                selectedCount: "selected",
                timeSlotLabel: "Time Slot:",
                morningSlot: "☀️ Morning (09:00 AM - 12:00 PM)",
                eveningSlot: "🌙 Evening (05:00 PM - 08:00 PM)",
                progTitle: "2. Module & Masterclass Tracker",
                progSubtitle: "Check off attended or completed masterclasses.",
                completedPct: "completed",
                followedMasterclass: "✓ Attended",
                toFollow: "To attend",
                notOpened: "🔒 Not open",
                notActiveAlert: "This masterclass has not been activated by the mentoring team yet.",
                maxFreqAlert: "You have selected a maximum frequency of {freq} days per week."
            }
        };

        function CandidateApp() {
            const [lang, setLang] = useState('fr');
            const [isLoading, setIsLoading] = useState(false);
            const [startups, setStartups] = useState([]);
            const [currentStartupId, setCurrentStartupId] = useState(null);
            const [selectedMcFilter, setSelectedMcFilter] = useState(null);
            const [activeModulesMap, setActiveModulesMap] = useState({});

            const t = I18N[lang];

            useEffect(() => {
                const saved = localStorage.getItem('candidate_portal_data');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            setStartups(parsed);
                            setCurrentStartupId(parsed[0].id);
                        }
                    } catch (e) { }
                }
                loadFromBackend();
            }, []);

            useEffect(() => {
                if (startups.length > 0) {
                    localStorage.setItem('candidate_portal_data', JSON.stringify(startups));
                }
            }, [startups]);

            const loadFromBackend = async () => {
                setIsLoading(true);
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL);
                    const data = await res.json();

                    let candidateList = [];
                    if (data.candidates && Array.isArray(data.candidates)) {
                        candidateList = data.candidates;
                    } else if (Array.isArray(data)) {
                        candidateList = data;
                    }

                    if (candidateList.length > 0) {
                        const formatted = candidateList.map(r => ({
                            id: r.id || r.candidate_id,
                            name: r.startup_name || r.name || 'Projet Sans Nom',
                            founder: r.founder_name || r.founder || 'Fondateur',
                            email: r.email || '',
                            answers: r.answers || {},
                            frequency: r.frequency || 2,
                            selectedDays: r.selectedDays || ['Lundi', 'Mercredi'],
                            timeSlot: r.timeSlot || 'matin',
                            completedModules: r.completedModules || [],
                            totalModules: 12,
                            jury_scores: r.jury_scores || {},
                            dailyAttendance: r.dailyAttendance || {}
                        }));

                        setStartups(formatted);
                        if (!currentStartupId) setCurrentStartupId(formatted[0].id);
                    }

                    if (data.activeModules) {
                        setActiveModulesMap(data.activeModules);
                    }
                } catch (e) {
                    console.warn("Connexion distante indisponible.", e);
                } finally {
                    setIsLoading(false);
                }
            };

            const updateField = (key, val) => {
                const updated = startups.map(s => s.id === currentStartupId ? { ...s, [key]: val } : s);
                setStartups(updated);
                const current = updated.find(s => s.id === currentStartupId);
                if (current) syncPreferences(current);
            };

            const syncPreferences = async (st) => {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'update_training_preferences',
                            candidate_id: st.id,
                            frequency: st.frequency,
                            selectedDays: st.selectedDays,
                            timeSlot: st.timeSlot,
                            completedModules: st.completedModules
                        })
                    });
                } catch (e) { }
            };

            const toggleDay = (dayFr) => {
                const cur = startups.find(s => s.id === currentStartupId);
                if (!cur) return;
                let days = [...(cur.selectedDays || [])];
                if (days.includes(dayFr)) {
                    days = days.filter(d => d !== dayFr);
                } else {
                    if (days.length < cur.frequency) days.push(dayFr);
                    else return alert(t.maxFreqAlert.replace('{freq}', cur.frequency));
                }
                updateField('selectedDays', days);
            };

            const toggleModuleCandidate = (id) => {
                if (!activeModulesMap[id]) {
                    alert(t.notActiveAlert);
                    return;
                }

                const cur = startups.find(s => s.id === currentStartupId);
                if (!cur) return;
                let mods = [...(cur.completedModules || [])];
                if (mods.includes(id)) mods = mods.filter(m => m !== id);
                else mods.push(id);
                updateField('completedModules', mods);
            };

            const activeStartup = startups.find(s => s.id === currentStartupId) || startups[0];
            const displayedModules = selectedMcFilter
                ? MODULES_LIST.filter(m => m.id === selectedMcFilter)
                : MODULES_LIST;

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 pb-12">
                    <header className="bg-slate-900 text-white px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
                        <div>
                            <h1 className="text-xl font-bold">{t.appTitleCandidate}</h1>
                            <p className="text-xs text-slate-400">{t.appSubtitle}</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <button onClick={loadFromBackend} disabled={isLoading} className="bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg border border-slate-700 font-bold">
                                {isLoading ? '...' : t.refreshBtn}
                            </button>

                            <div className="bg-slate-800 p-1 rounded-lg border border-slate-700 text-xs font-bold space-x-1">
                                <button onClick={() => setLang('fr')} className={`px-2 py-1 rounded ${lang === 'fr' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>FR</button>
                                <button onClick={() => setLang('en')} className={`px-2 py-1 rounded ${lang === 'en' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>EN</button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                        {activeStartup && (
                            <div className="space-y-6 max-w-5xl mx-auto">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                    <span className="text-xs font-bold text-slate-500 uppercase">{t.selectedAccount}</span>
                                    <select
                                        value={currentStartupId || ''}
                                        onChange={e => setCurrentStartupId(e.target.value)}
                                        className="bg-slate-100 border p-2 rounded-lg text-xs font-bold text-indigo-900"
                                    >
                                        {startups.map(s => <option key={s.id} value={s.id}>{s.name} ({s.founder})</option>)}
                                    </select>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl border space-y-5">
                                        <h3 className="font-bold text-slate-900 border-b pb-2">{t.availTitle}</h3>

                                        <div className="space-y-2">
                                            <div className="flex justify-between items-center">
                                                <label className="text-xs font-semibold text-slate-600 block">{t.mcScheduleTitle}</label>
                                                {selectedMcFilter && (
                                                    <button
                                                        onClick={() => setSelectedMcFilter(null)}
                                                        className="text-[10px] text-indigo-600 font-bold hover:underline"
                                                    >
                                                        {t.showAllMc}
                                                    </button>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                {MASTERCLASS_SCHEDULE.map(mc => {
                                                    const moduleInfo = MODULES_LIST.find(m => m.id === mc.id);
                                                    const isSelected = selectedMcFilter === mc.id;

                                                    return (
                                                        <div
                                                            key={mc.id}
                                                            onClick={() => setSelectedMcFilter(isSelected ? null : mc.id)}
                                                            className={`p-2.5 rounded-xl border flex flex-col justify-between shadow-sm cursor-pointer transition hover:scale-105 ${mc.bg} ${isSelected ? 'ring-2 ring-indigo-600 ring-offset-1 font-bold shadow-md' : 'opacity-90'}`}
                                                        >
                                                            <div className="flex items-center justify-between mb-1">
                                                                <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded ${mc.badgeBg}`}>
                                                                    MC {mc.id}
                                                                </span>
                                                                {isSelected && <span className="text-indigo-600 text-xs font-black">✓</span>}
                                                            </div>
                                                            <p className="text-[10px] font-bold truncate leading-tight mb-2" title={moduleInfo ? moduleInfo.title[lang] : ''}>
                                                                {moduleInfo ? moduleInfo.title[lang] : `Masterclass ${mc.id}`}
                                                            </p>
                                                            <div className="pt-1 border-t border-slate-200/60 text-center">
                                                                <span className="text-xs font-extrabold uppercase tracking-wider block">
                                                                    📅 {mc.date}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-semibold text-slate-600">{t.weeklyFreq}</label>
                                            <div className="grid grid-cols-2 gap-2 mt-1">
                                                {[2, 3].map(f => (
                                                    <button key={f} onClick={() => updateField('frequency', f)} className={`p-2.5 rounded-xl border text-center ${activeStartup.frequency === f ? 'bg-indigo-50 border-indigo-600 ring-1 ring-indigo-500' : 'bg-slate-50'}`}>
                                                        <span className="block font-bold text-sm">{f} {t.timesPerWeek}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-semibold text-slate-600">{t.presenceDays}</label>
                                            <div className="grid grid-cols-2 gap-2 mt-1">
                                                {DAYS_MAP.map((dFr, idx) => {
                                                    const isSel = (activeStartup.selectedDays || []).includes(dFr);
                                                    return (
                                                        <button key={dFr} onClick={() => toggleDay(dFr)} className={`p-2 rounded-lg text-xs font-bold border flex justify-between ${isSel ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700'}`}>
                                                            <span>{DAYS_OF_WEEK[lang][idx]}</span>
                                                            {isSel && <span>✓</span>}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="text-xs font-semibold text-slate-600">{t.timeSlotLabel}</label>
                                            <div className="space-y-2 mt-1">
                                                <button onClick={() => updateField('timeSlot', 'matin')} className={`w-full p-2.5 text-left rounded-xl border text-xs font-bold ${activeStartup.timeSlot === 'matin' ? 'bg-amber-50 border-amber-500 ring-1 ring-amber-400' : 'bg-slate-50'}`}>{t.morningSlot}</button>
                                                <button onClick={() => updateField('timeSlot', 'soir')} className={`w-full p-2.5 text-left rounded-xl border text-xs font-bold ${activeStartup.timeSlot === 'soir' ? 'bg-indigo-50 border-indigo-600 ring-1 ring-indigo-500' : 'bg-slate-50'}`}>{t.eveningSlot}</button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="md:col-span-2 bg-white p-6 rounded-2xl border space-y-4">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <div>
                                                <h3 className="font-bold text-slate-900">{t.progTitle}</h3>
                                                <p className="text-xs text-slate-500">{t.progSubtitle}</p>
                                            </div>
                                            <span className="text-xl font-extrabold text-indigo-600">
                                                {Math.round(((activeStartup.completedModules || []).length / activeStartup.totalModules) * 100)}%
                                            </span>
                                        </div>

                                        <div className="space-y-3">
                                            {displayedModules.map(mod => {
                                                const done = (activeStartup.completedModules || []).includes(mod.id);
                                                const isActiveByMentor = !!activeModulesMap[mod.id];
                                                const mcSchedule = MASTERCLASS_SCHEDULE.find(s => s.id === mod.id);

                                                return (
                                                    <div
                                                        key={mod.id}
                                                        onClick={() => toggleModuleCandidate(mod.id)}
                                                        className={`p-4 rounded-xl border flex justify-between items-center transition ${!isActiveByMentor
                                                            ? 'bg-slate-100 border-slate-200 cursor-not-allowed opacity-60'
                                                            : done
                                                                ? 'bg-emerald-50 border-emerald-300 cursor-pointer shadow-sm hover:border-emerald-400'
                                                                : 'bg-slate-50 cursor-pointer hover:bg-slate-100'
                                                            }`}
                                                    >
                                                        <div className="flex items-center space-x-3">
                                                            <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${done ? 'bg-emerald-600 text-white' : 'bg-slate-300 text-slate-700'}`}>{done ? '✓' : mod.id}</div>
                                                            <div>
                                                                <div className="flex items-center space-x-2">
                                                                    <span className="text-xs font-bold text-slate-800">{mod.title[lang]}</span>
                                                                    {mcSchedule && (
                                                                        <span className="text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">
                                                                            📅 {mcSchedule.date}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold ${!isActiveByMentor
                                                            ? 'bg-slate-200 text-slate-500'
                                                            : done
                                                                ? 'bg-emerald-200 text-emerald-900'
                                                                : 'bg-indigo-100 text-indigo-800'
                                                            }`}>
                                                            {!isActiveByMentor ? t.notOpened : done ? t.followedMasterclass : t.toFollow}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CandidateApp />);
    </script>
</body>

</html>
